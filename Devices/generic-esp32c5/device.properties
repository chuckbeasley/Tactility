general.vendor=Generic
general.name=ESP32-C5

apps.launcherAppId=Launcher

hardware.target=ESP32C5
hardware.flashSize=16MB
hardware.flashMode=DIO
hardware.esptoolFlashFreq=40M
hardware.spiRam=true
hardware.spiRamMode=QUAD
hardware.spiRamSpeed=40M
hardware.bluetooth=true

display.size=4.0"
display.shape=rectangle
display.dpi=165
lvgl.colorDepth=16

storage.userDataLocation=Internal

sdkconfig.CONFIG_COMPILER_DISABLE_DEFAULT_ERRORS=y

# Use native ESP32-C5 Wi-Fi/ESP-NOW. Keeping esp_hosted (SPI transport) enabled on C5
# conflicts with the single SPI host used by the ST7796 display.
sdkconfig.CONFIG_ESP_HOSTED_ENABLED=n
sdkconfig.CONFIG_BT_NIMBLE_MESH=n
sdkconfig.CONFIG_BLE_MESH=n
# The ESP-IDF secondary USB Serial/JTAG VFS node is unavailable on this C5.
sdkconfig.CONFIG_ESP_CONSOLE_SECONDARY_NONE=y
# FatFS metadata allocations are small and must remain in reliable internal RAM.
sdkconfig.CONFIG_FATFS_ALLOC_PREFER_EXTRAM=n
# The C5 ROM TLSF implementation faults in the FATFS/LWIP init paths, so use the IDF one.
# PartitionsEsp.cpp asserts this at compile time - do not remove without removing that guard.
sdkconfig.CONFIG_HEAP_TLSF_USE_ROM_IMPL=n
# C5 task stacks may be accessed while the cache is disabled. (Task-stack-in-PSRAM was tried but
# the C5 tasks here use static/caller-provided stacks, so it relocated nothing — no memory gain.)
sdkconfig.CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=n
sdkconfig.CONFIG_SPIRAM_MEMTEST=y
sdkconfig.CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=n
sdkconfig.CONFIG_SPIRAM_USE_CAPS_ALLOC=n
sdkconfig.CONFIG_SPIRAM_USE_MALLOC=y
sdkconfig.CONFIG_SPIRAM_XIP_FROM_PSRAM=n
# Move system/library BSS to PSRAM to free internal RAM. Verified stable: the device boots,
# mounts FATFS, connects WiFi and serves the web server normally (an earlier HTTP failure was a
# web server that hadn't been started, not a network-stack issue). Freed ~21.7 KB of internal
# heap (total 255 KB -> ~277 KB).
sdkconfig.CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
# Only allocations at or below this size are forced into internal RAM; larger malloc() calls
# prefer PSRAM. Lowered from 1024 to 256 so the 256-1024 byte general-purpose allocations (LVGL
# widgets, C++ containers, app state) land in PSRAM instead of the scarce internal pool. Task
# stacks, FATFS and Wi-Fi/LWIP are each pinned to internal RAM by their own options above, so
# this only redirects general-purpose allocations, which is the intent stated below.
sdkconfig.CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256
# Reserve 32KB internal pool; 24KB proved unstable during early FATFS mount on C5.
sdkconfig.CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
# Keep LWIP off the PSRAM-prefer path. Enabling it is blocked at compile time on ESP32-C5
# (PartitionsEsp.cpp #error: "triggers unstable LWIP heap path"), so it must stay n here.
sdkconfig.CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n
sdkconfig.CONFIG_VFS_SELECT_IN_RAM=y
# LVGL image cache budget. This must be larger than the biggest single decoded image or that
# image can never be cached at all: lv_cache_add() returns LV_CACHE_RESERVE_COND_TOO_LARGE ->
# NULL, and lv_lodepng's decoder_open() turns that into LV_RESULT_INVALID, so the image silently
# draws as nothing. At the previous 16384 that capped renderable images at 64x64 ARGB8888 and
# blanked the 80x103 boot logo (32960 bytes). LVGL allocates through libc malloc here (see
# CONFIG_LV_USE_CLIB_MALLOC below) with SPIRAM_MALLOC_ALWAYSINTERNAL=1024, so this cache lives
# in PSRAM and costs essentially no internal RAM.
sdkconfig.CONFIG_LV_CACHE_DEF_SIZE=262144
# Free internal RAM by moving code out of IRAM. On the C5 the HP SRAM pool is shared between
# IRAM and the heap, so every byte of code not pinned to IRAM becomes available heap. device.py
# only applies these on the original ESP32 (see write_cpu_variables), so the C5 must opt in here.
# Measured static IRAM cost before this: libpp 16.8KB, libesp_hw_support 14.3KB, libheap 7.3KB.
# The trade-off is Wi-Fi throughput and a flash-cache-miss penalty on heap/ringbuf calls, which
# matches the reasoning already recorded for the ESP32 path.
sdkconfig.CONFIG_ESP_WIFI_IRAM_OPT=n
sdkconfig.CONFIG_ESP_WIFI_RX_IRAM_OPT=n
sdkconfig.CONFIG_HEAP_PLACE_FUNCTION_INTO_FLASH=y
sdkconfig.CONFIG_RINGBUF_PLACE_ISR_FUNCTIONS_INTO_FLASH=y
# Route LVGL allocations through libc malloc so they can use PSRAM under
# CONFIG_SPIRAM_USE_MALLOC.
sdkconfig.CONFIG_LV_USE_BUILTIN_MALLOC=n
sdkconfig.CONFIG_LV_USE_CLIB_MALLOC=y
# Route mbedTLS (TLS handshake buffers, cert chains) through libc malloc so HTTPS downloads use
# the 8MB PSRAM instead of the C5's limited internal RAM. Without this, repeated HTTPS downloads
# (e.g. the App Hub manifest refresh) exhaust internal RAM and the TLS handshake fails with
# "Cannot reach server". On a build without flash encryption the PSRAM holds TLS secrets no less
# protected than internal RAM, so this is safe here.
sdkconfig.CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
# Screenshot capture (lv_snapshot_take) backs the /api/screenshot endpoint and the screenshot
# service/app. Large RGB888 snapshot buffers land in PSRAM via SPIRAM malloc, so it can stay on.
sdkconfig.CONFIG_LV_USE_SNAPSHOT=y
sdkconfig.CONFIG_ESP_SYSTEM_USE_FRAME_POINTER=y
sdkconfig.CONFIG_TT_TOUCH_CALIBRATION_SUPPORTED=y
sdkconfig.CONFIG_COMPILER_OPTIMIZATION_SIZE=y
sdkconfig.CONFIG_COMPILER_OPTIMIZATION_DEBUG=n
sdkconfig.CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE=y
sdkconfig.CONFIG_LWIP_MAX_SOCKETS=12
sdkconfig.CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=8
sdkconfig.CONFIG_LWIP_TCP_SND_BUF_DEFAULT=1460
sdkconfig.CONFIG_LWIP_TCP_WND_DEFAULT=1460
sdkconfig.CONFIG_ESP_WIFI_MGMT_SBUF_NUM=8
sdkconfig.CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
sdkconfig.CONFIG_BT_NIMBLE_ACL_BUF_COUNT=8
sdkconfig.CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=12
sdkconfig.CONFIG_FATFS_PER_FILE_CACHE=y
# The data partition image is built by wl_fatfsgen.py WITHOUT wear-levelling safe mode
# (fatfs_create_spiflash_image passes no --wl-mode safe). Safe mode reserves two extra
# flash sectors for power-loss recovery, shrinking the WL block device 8192 bytes below
# the generated FAT image and hiding its last 16 clusters. Use Perf mode to match the image.
sdkconfig.CONFIG_WL_SECTOR_MODE_PERF=y
sdkconfig.CONFIG_WL_SECTOR_MODE_SAFE=n
sdkconfig.CONFIG_ESP_WIFI_TX_HETB_QUEUE_NUM=3
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_HESIGB=y
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_MU_CFO=y
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_CTRL_NDPA=y
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_CTRL_BFRP=y
