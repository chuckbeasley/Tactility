general.vendor=Waveshare
general.name=ESP32-C5-Touch-LCD-3.5

apps.launcherAppId=Launcher

# Same SoC as generic-esp32c5 (ESP32-C5-WROOM-1U): 384 KB SRAM, 8 MB PSRAM, and now 32 MB flash.
# Everything in the sdkconfig block below is SoC-level tuning carried over from the generic C5
# device, where each value has a measured reason. Only the board-level lines (flash size, panel,
# storage) differ.
hardware.target=ESP32C5
hardware.flashSize=32MB
hardware.flashMode=DIO
hardware.esptoolFlashFreq=40M
hardware.spiRam=true
hardware.spiRamMode=QUAD
hardware.spiRamSpeed=40M
hardware.bluetooth=true

# 3.5" 320x480 IPS, ST7796 over SPI, FT6336 touch over I2C. NOTE: 320x480 is portrait, where the
# generic board is 480x320 landscape - the LVGL resolution and any panel offsets must be set from
# the board's own init sequence, not copied. DPI is nominal.
display.size=3.5"
display.shape=rectangle
display.dpi=165
lvgl.colorDepth=16

storage.userDataLocation=Internal

# ---- Board-specific: the console ----
# This board has no USB-UART bridge. Its USB-C port is wired straight to the ESP32-C5's native
# USB-Serial-JTAG peripheral (esptool identifies it as VID_303A&PID_1001), and that is where the
# vendor firmware's own log comes out - which is how this board's boot log was captured at all.
# IDF otherwise defaults to a UART0 console on GPIO 11/12, which on this board goes nowhere: the ROM
# loader still prints over USB (it always mirrors there), but the bootloader banner, every app log
# line and every panic message are written to pins with nothing attached. That silence is misleading
# - it looks like a hang. The generic C5 profile next door really does have a CH343 bridge on GPIO
# 11/12, so this setting is deliberately NOT carried over from it.
sdkconfig.CONFIG_ESP_CONSOLE_UART_DEFAULT=n
sdkconfig.CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y

# ---- Project-wide requirement that has to live here to survive ----
# CONFIG_HTTPD_WS_SUPPORT is documented in sdkconfig.md as a manual step ("copy these into sdkconfig
# manually"), because the web server's /ws/remote endpoint needs the httpd WebSocket API
# (httpd_ws_recv_frame/httpd_ws_send_frame). Keeping it only in sdkconfig means device.py throws it
# away: that script deletes sdkconfig and rebuilds it from device.properties alone, so the setting
# silently vanished on the next device switch and WebServerService.cpp stopped compiling
# ("'httpd_ws_frame_t' was not declared"). It is set from the profile so that cannot happen again.
#
# NOT carried over, deliberately, though sdkconfig.md also documents them:
#   CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH needs a coredump partition, and the 32 MB table this device
#     selects (partitions-32mb-no-sd.csv) has none. Adding one changes the layout for tulip-4r11 too,
#     which shares that table, so it is a separate decision rather than a free addition.
#   CONFIG_SPIRAM_SPEED_80M is measured faster on the other C5 board, but the documented failure mode
#     is "no serial output after the ROM banner" if the part is not rated for it. That is a poor trade
#     during first bring-up of a board whose panel is not yet known to work; 40M is kept for now.
sdkconfig.CONFIG_HTTPD_WS_SUPPORT=y

# ---- Carried over from the generic C5, unchanged ----

sdkconfig.CONFIG_COMPILER_DISABLE_DEFAULT_ERRORS=y

# No esp_hosted: on C5 its SPI transport conflicts with the SPI host the display needs.
sdkconfig.CONFIG_ESP_HOSTED_ENABLED=n
sdkconfig.CONFIG_BT_NIMBLE_MESH=n
sdkconfig.CONFIG_BLE_MESH=n
sdkconfig.CONFIG_ESP_CONSOLE_SECONDARY_NONE=y
# FatFS metadata allocations are small and stay in reliable internal RAM.
sdkconfig.CONFIG_FATFS_ALLOC_PREFER_EXTRAM=n
# The C5 ROM TLSF implementation faults in the FATFS/LWIP init paths; PartitionsEsp.cpp asserts this.
sdkconfig.CONFIG_HEAP_TLSF_USE_ROM_IMPL=n
# C5 task stacks may be accessed while the cache is disabled.
sdkconfig.CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=n
sdkconfig.CONFIG_SPIRAM_MEMTEST=y
sdkconfig.CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=n
sdkconfig.CONFIG_SPIRAM_USE_CAPS_ALLOC=n
sdkconfig.CONFIG_SPIRAM_USE_MALLOC=y
sdkconfig.CONFIG_SPIRAM_XIP_FROM_PSRAM=n
# System/library BSS in PSRAM: freed ~21.7 KB of internal heap on the generic board.
sdkconfig.CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
# Only allocations at or below this size are forced into internal RAM; larger malloc() calls prefer
# PSRAM. Lowered 1024 -> 256 so 256-1024 byte general-purpose allocations (LVGL widgets, C++
# containers, app state) land in PSRAM. Task stacks, FATFS and Wi-Fi/LWIP are pinned internal by
# their own options, so this only redirects general-purpose allocations.
sdkconfig.CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256
# Reserve 32 KB internal pool; 24 KB proved unstable during early FATFS mount on C5.
sdkconfig.CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
# Keep LWIP off the PSRAM-prefer path: blocked at compile time on C5 by PartitionsEsp.cpp.
sdkconfig.CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n
sdkconfig.CONFIG_VFS_SELECT_IN_RAM=y

# LVGL image cache: must exceed the largest decoded image or it can never be cached at all. 256 KB
# lives in PSRAM under the malloc settings above and costs essentially no internal RAM.
sdkconfig.CONFIG_LV_CACHE_DEF_SIZE=262144

# Free internal RAM by moving code out of IRAM. On C5 the HP SRAM pool is shared between IRAM and
# the heap, so every byte of code not pinned to IRAM becomes heap. Measured on the generic board:
# .iram0.text 107,764 -> 94,230 bytes (13.5 KB). The trade is Wi-Fi throughput and flash-cache-miss
# latency on those paths - a deliberate choice, not a free win.
sdkconfig.CONFIG_ESP_WIFI_IRAM_OPT=n
sdkconfig.CONFIG_ESP_WIFI_RX_IRAM_OPT=n
sdkconfig.CONFIG_HEAP_PLACE_FUNCTION_INTO_FLASH=y
sdkconfig.CONFIG_RINGBUF_PLACE_ISR_FUNCTIONS_INTO_FLASH=y

# LVGL and mbedTLS through libc malloc so they can use PSRAM (8 MB) instead of internal RAM.
sdkconfig.CONFIG_LV_USE_BUILTIN_MALLOC=n
sdkconfig.CONFIG_LV_USE_CLIB_MALLOC=y
sdkconfig.CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

# Screenshot capture (lv_snapshot_take) and GIF decoding for the radar view; both allocate in PSRAM.
sdkconfig.CONFIG_LV_USE_SNAPSHOT=y
sdkconfig.CONFIG_LV_USE_GIF=y

sdkconfig.CONFIG_ESP_SYSTEM_USE_FRAME_POINTER=y
# Touch calibration IS supported here, even though this is a capacitive FT6336 that does not need
# calibrating in principle. It is enabled because the touch panel's coordinate frame does not match
# the display's at power-on - the panel is scanned with MADCTL MX set (see the .dts mirror-x) and the
# controller reports in its own axes - and this app is the tool that measures and corrects that.
# touch.calibrationSupported is the property device.py reads to emit CONFIG_TT_TOUCH_CALIBRATION_SUPPORTED.
touch.calibrationSupported=true

sdkconfig.CONFIG_COMPILER_OPTIMIZATION_SIZE=y
sdkconfig.CONFIG_COMPILER_OPTIMIZATION_DEBUG=n
sdkconfig.CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE=y

sdkconfig.CONFIG_LWIP_MAX_SOCKETS=12
sdkconfig.CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=8
# 2 x MSS. lwIP cannot use the PSRAM heap on this chip (the guard above), so the window and send
# buffer are internal RAM per active connection: 11.5 KB at IDF's 5760 default, 5.8 KB here.
sdkconfig.CONFIG_LWIP_TCP_SND_BUF_DEFAULT=2880
sdkconfig.CONFIG_LWIP_TCP_WND_DEFAULT=2880

sdkconfig.CONFIG_ESP_WIFI_MGMT_SBUF_NUM=8
sdkconfig.CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
sdkconfig.CONFIG_BT_NIMBLE_ACL_BUF_COUNT=8
sdkconfig.CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=12
sdkconfig.CONFIG_FATFS_PER_FILE_CACHE=y
# The data partition image is built without wear-levelling safe mode, so use Perf to match it.
sdkconfig.CONFIG_WL_SECTOR_MODE_PERF=y
sdkconfig.CONFIG_WL_SECTOR_MODE_SAFE=n
sdkconfig.CONFIG_ESP_WIFI_TX_HETB_QUEUE_NUM=3
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_HESIGB=y
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_MU_CFO=y
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_CTRL_NDPA=y
sdkconfig.CONFIG_ESP_WIFI_ENABLE_DUMP_CTRL_BFRP=y

# The radar view opens several TLS connections; session tickets let a re-established connection resume.
sdkconfig.CONFIG_ESP_TLS_CLIENT_SESSION_TICKETS=y

# Task stacks sized from measurement rather than habit (esp_timer 484 bytes used, idle 392).
sdkconfig.CONFIG_ESP_TIMER_TASK_STACK_SIZE=2048
sdkconfig.CONFIG_FREERTOS_IDLE_TASK_STACKSIZE=1024

# Bluetooth is required on this board, so the stacks it runs are the only remaining lever. Measured
# with BLE active via uxTaskGetStackHighWaterMark: NimBLE host 1,708 bytes of its stack, controller
# 752, Tactility's bt-events 1,256. Sized to ~1.8x / ~2.7x / ~1.6x those peaks, worth 4 KB of
# internal RAM that is resident for the whole boot once any BLE app has started the radio.
# device.py raises the host stack to 8192 for every device, so this has to be set here to take effect.
sdkconfig.CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=3072
sdkconfig.CONFIG_BT_LE_CONTROLLER_TASK_STACK_SIZE=2048

# ---- Board-specific facts ----
# Recovered from the factory image (project name "esp32_c5_touch_lcd_3_5", ESP-IDF v5.5.4, flashed by
# Waveshare) and then confirmed on the board, because Waveshare publishes no schematic and no example
# for this SKU. These are measurements, not datasheet claims:
#
#   I2C bus          SDA=GPIO27, SCL=GPIO26, 100 kHz. The board bus: QMI8658 (0x6B), PCF85063A, SHTC3,
#                    the AXP2101 PMIC (0x34) and the CH32V003 IO-expander (0x24) are all on it.
#                    It is NOT 4/5 - that pair belongs to the camera's SCCB, which the vendor's own
#                    example passes to a separate bus and which fails to probe (no camera fitted).
#                    Corrected after a hardware scan: 27/26 answers, 4/5 answers nothing at all.
#   SPI bus          SCLK=GPIO6, MOSI=GPIO7, MISO=GPIO2 on SPI2, shared by the display and the TF card
#                    (the vendor firmware has exactly one SPI bus). Proven independently of the panel:
#                    the card answers CMD0 with R1=0x01 at its own CS=GPIO9.
#   TF card          SDSPI on that bus, CS=GPIO9, no card-detect/WP/interrupt pins. Mounts a FAT
#                    volume at runtime (956 KB partition, 138 KB used). An on-board jumper (JP8 pin 2
#                    per the vendor's own "please check JP8" message) gates the card.
#   Display          ST7796 over SPI, CS=GPIO8, DC=GPIO5, no reset GPIO (software SWRESET), 320x480,
#                    BGR element order. See the .dts for the two bring-up steps it needs first.
#   Backlight        PWM channel of the CH32V003 expander at 0x24 (register 5 = duty), NOT a GPIO and
#                    NOT a PMIC rail. No devicetree binding for it yet; the expander holds it on.
#   Touch            FT6336 over I2C at 0x38 on the board bus, INT=GPIO3, no reset pin.
#   Power            AXP2101 PMIC (XPowersLib) at 0x34. Its rail enables are the FIRST thing the
#                    vendor's app_main does (reg 0x90 = 0xFF, reg 0x91 bit 0) and the panel stays
#                    mute without them.
#   Audio            ES8311 in I2S SLAVE mode, 16-bit mono, 16 kHz, mclk_multiple 256.
#   Camera           BF3901 on the shared I2C SCCB; not fitted on this unit.
#   Partitioning     vendor layout: factory app 5000K @0x20000, ota_0 3584K, assets spiffs 128K
#                    @0x890000 (unformatted), storage spiffs 1M @0x8b0000. ~2.6 MB of 32 MB used.
#
# RESOLVED. The vendor compiles the panel pins as immediates - no text, no Kconfig entry, no config
# file, and an empty assets partition - so they were recovered by disassembling the factory image
# (wrk/vendor_recon.py and the scripts around it) and then confirmed on the board. What took the
# longest was not finding the pins: it was that the panel stays completely mute, on correct pins,
# until the AXP2101 rails are enabled and the CH32V003 expander has pulsed its reset pins. Both now
# happen in source/module.cpp before the display driver starts.
#
# Still open, and deliberately not guessed at: the backlight has no devicetree binding (the expander
# holds it on, so the panel is lit), the FT6336 touch controller has no driver in this tree, and the
# ES8311 audio path is not wired up.

